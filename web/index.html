<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Trading Lab — research terminal</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="fx" aria-hidden="true"><i></i></div>
<a class="skip" href="#view">Skip to content</a>
<aside id="side">
    <a class="brand" href="#/overview" aria-label="Trading Lab, go to overview"><b>TL</b><span>TRADING<br>LAB</span></a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="sidefoot"><span>LIVE TRADING</span><b>DISABLED</b><span>RESEARCH TERMINAL · LOCAL</span></div>
</aside>
<div id="main">
    <header id="top">
        <div class="tb-brand"><b>TRADING LAB</b><i>/</i><span id="crumb">RESEARCH TERMINAL</span></div>
        <div class="search"><input id="q" placeholder="SEARCH SYMBOL OR PAGE" autocomplete="off" aria-label="Search symbol or page"><div class="pop" id="qpop" hidden></div></div>
        <dl class="tb-status" aria-label="System status">
            <div id="st-data" title="Market data in this lab is historical. Nothing after the research cut-off is ever loaded."><dt>DATA</dt><dd>…</dd><small></small></div>
            <div id="st-sys"><dt>SYSTEM</dt><dd>…</dd><small></small></div>
            <div id="st-mkt" title="By the clock only: Monday to Friday, 09:15 to 15:30 IST. Exchange holidays are not known. This is not a feed."><dt>MARKET</dt><dd>…</dd><small>BY CLOCK · NOT A FEED</small></div>
            <div><dt>TIME</dt><dd id="clock">…</dd><small id="date"></small></div>
        </dl>
    </header>
    <main id="view" tabindex="-1"></main>
</div>
<aside id="drawer" role="dialog" aria-label="Details" tabindex="-1"></aside>
<script type="module" src="js/app.js"></script>
</body>
</html>
